<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Fashion Store Suite</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header>
        <div class="logo">
            <h1><a href="index.html" style="text-decoration: none; color: inherit;">Fashion Store Suite</a></h1>
        </div>
        <nav class="gender-selector">
            <a href="#">Hombre</a>
            <a href="#">Mujer</a>
            <a href="#">Unisex</a>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Buscar ropa...">
            <button>Buscar</button>
        </div>
        <div class="user-actions">
            <a href="index.html">Inicio</a>
            <a href="shop.html">Tienda</a>
            <a href="#">🛒 Carrito (0)</a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: FORMULARIO DE CITAS -->
    <main>
        <section class="booking-section">
            <h2>Reserva tu Cita de Asesoría</h2>
            <p>Rellena el formulario para reservar una sesión personalizada con nuestro equipo de expertos.</p>

            <!-- Formulario conectado mediante POST al backend en PHP -->
            <form action="../backend/api/save-booking.php" method="POST" class="booking-form">
                
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" required placeholder="Tu nombre">
                </div>

                <div class="form-group">
                    <label for="surname">Apellidos:</label>
                    <input type="text" id="surname" name="surname" required placeholder="Tus apellidos">
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Tu número de teléfono">
                </div>

                <div class="form-group">
                    <label for="date">Fecha de la cita:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="time">Hora:</label>
                    <input type="time" id="time" name="time" required>
                </div>

                <div class="form-group">
                    <label for="service_type">Tipo de Servicio:</label>
                    <select id="service_type" name="service_type" required>
                        <option value="">Selecciona una opción</option>
                        <option value="Personal Shopper">Personal Shopper</option>
                        <option value="Asesoria de Imagen">Asesoría de Imagen</option>
                        <option value="Fondo de Armario">Renovación de Fondo de Armario</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Confirmar Reserva</button>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Fashion Store Suite. Todos los derechos reservados.</p>
            <ul class="social-links">
                <li><a href="#" target="_blank">Facebook</a></li>
                <li><a href="#" target="_blank">TikTok</a></li>
                <li><a href="#" target="_blank">Instagram</a></li>
                <li><a href="#" target="_blank">X</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
